name: Build Termux-ZRAM ARM64
on:
  push:
    branches: [zram-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TERMUX_PACKAGES_REF: c208d019879c2d790ca50fe30d144b9a5979dfbf
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test RAMZ core
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-dev libzstd-dev
          make -C ramz-native clean
          make -C ramz-native TEST_HOOKS=1 test
          make -C ramz-native benchmark
      - name: Build custom ARM64 bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          touch bootstrap-build.log
          git clone --depth=1 https://github.com/termux/termux-packages.git termux-packages-build
          git -C termux-packages-build fetch --depth=1 origin "$TERMUX_PACKAGES_REF"
          git -C termux-packages-build checkout --detach "$TERMUX_PACKAGES_REF"
          cp -a termux-packages/packages/ramz termux-packages-build/packages/ramz
          sed -i "s/, libcap-ng//; s/--enable-setpriv/--disable-setpriv/" termux-packages-build/packages/util-linux/build.sh
          curl -fsSL -o ramz-source.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          RAMZ_SHA256="$(sha256sum ramz-source.tar.gz | sed "s/ .*//")"
          sed -i "s|refs/heads/zram-runtime|${GITHUB_SHA}|; s/REPLACE_WITH_WORKFLOW_SHA256/${RAMZ_SHA256}/" termux-packages-build/packages/ramz/build.sh
          sed -i "s/^TERMUX_APP__PACKAGE_NAME=.*/TERMUX_APP__PACKAGE_NAME=\"com.termuxzram\"/" termux-packages-build/scripts/properties.sh
          sed -i "s|^TERMUX_APP__DATA_DIR=.*|TERMUX_APP__DATA_DIR=\"/data/data/\$TERMUX_APP__PACKAGE_NAME\"|" termux-packages-build/scripts/properties.sh
          sed -i "/    defaultConfig {/a\        applicationId \"com.termuxzram\"" app/build.gradle
          sed -i "s/manifestPlaceholders.TERMUX_PACKAGE_NAME = \"com.termux\"/manifestPlaceholders.TERMUX_PACKAGE_NAME = \"com.termuxzram\"/" app/build.gradle
          sed -i "s/public static final String TERMUX_PACKAGE_NAME = \"com.termux\"/public static final String TERMUX_PACKAGE_NAME = \"com.termuxzram\"/" termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java
          sed -i "s/<!ENTITY TERMUX_PACKAGE_NAME \"com.termux\">/<!ENTITY TERMUX_PACKAGE_NAME \"com.termuxzram\">/; s/<!ENTITY TERMUX_APP_NAME \"Termux\">/<!ENTITY TERMUX_APP_NAME \"Termux-ZRAM\">/" app/src/main/res/values/strings.xml
          grep -F "applicationId \"com.termuxzram\"" app/build.gradle
          grep -F "TERMUX_PACKAGE_NAME = \"com.termuxzram\"" termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java
          cd termux-packages-build
          ./scripts/run-docker.sh ./clean.sh
          sed -i "/^TERMUX_PKG_DEPENDS=/s/\<bzip2\>/libbz2/g" packages/dpkg/build.sh packages/termux-tools/build.sh
          sed -i "s/PACKAGES+=(\"bzip2\")/PACKAGES+=(\"libbz2\")/" scripts/build-bootstraps.sh
          sed -i -E "/PACKAGES\+=\(\"(ed|debianutils|dos2unix|inetutils|lsof|nano|net-tools|patch|unzip)\"\)/d" scripts/build-bootstraps.sh
          grep -F "PACKAGES+=(\"libbz2\")" scripts/build-bootstraps.sh
          ! grep -E "^TERMUX_PKG_DEPENDS=.*(^|, )bzip2([, ]|$)" packages/dpkg/build.sh packages/termux-tools/build.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --android10 --architectures aarch64 --add ramz 2>&1 | tee ../bootstrap-build.log
          test -s bootstrap-aarch64.zip
          unzip -l bootstrap-aarch64.zip | grep -E "[[:space:]]bin/ramz$"
          unzip -l bootstrap-aarch64.zip | grep -E "[[:space:]]lib/libramz[.]so$"
          cp bootstrap-aarch64.zip ../app/src/main/cpp/bootstrap-aarch64.zip
          sha256sum ../app/src/main/cpp/bootstrap-aarch64.zip > ../bootstrap-aarch64.zip.sha256
      - name: Validate bootstrap ARM64
        run: |
          unzip -p app/src/main/cpp/bootstrap-aarch64.zip bin/ramz > ramz
          unzip -p app/src/main/cpp/bootstrap-aarch64.zip lib/libramz.so > libramz.so
          file ramz libramz.so | grep -E "ARM aarch64|ARM64"
      - name: Build and validate APK
        run: |
          set -euxo pipefail
          export TERMUX_ZRAM_BOOTSTRAP_AARCH64_SHA256="$(sha256sum app/src/main/cpp/bootstrap-aarch64.zip | sed "s/ .*//")"
          export TERMUX_APP_VERSION_NAME=0.118.0-zram.1
          export TERMUX_APK_VERSION_TAG="termux-zram-${GITHUB_SHA}"
          export TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS=1
          ./gradlew --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug -name "*arm64-v8a.apk" -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep "com.termuxzram"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libtermux-bootstrap[.]so$"
          cp "$APK" Termux-ZRAM-arm64-v8a-debug.apk
          sha256sum Termux-ZRAM-arm64-v8a-debug.apk > Termux-ZRAM-arm64-v8a-debug.apk.sha256
      - name: Publish verified APK
        uses: actions/upload-artifact@v6
        with:
          name: Termux-ZRAM-arm64-v8a
          path: |
            Termux-ZRAM-arm64-v8a-debug.apk
            Termux-ZRAM-arm64-v8a-debug.apk.sha256
            app/src/main/cpp/bootstrap-aarch64.zip
            bootstrap-aarch64.zip.sha256
          if-no-files-found: error
      - name: Preserve bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Termux-ZRAM-bootstrap-build-log
          path: bootstrap-build.log
          if-no-files-found: warn
